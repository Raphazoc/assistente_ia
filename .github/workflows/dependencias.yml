name: Verificar atualizações de dependências

on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Instalar lock e conferir atualizações disponíveis
        shell: pwsh
        run: |
          python -m pip install -r requirements-ci.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip list --outdated --format=columns | Tee-Object -FilePath dependencias-desatualizadas.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dependencias-desatualizadas
          path: dependencias-desatualizadas.txt
